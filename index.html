<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fcf8ee" />
    <meta name="description" content="09.14 삐약이의 생일 대모험" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="삐약 대모험" />
    <title>삐약이의 생일 대모험</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=8" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud" aria-label="게임 진행 상황">
        <div class="brand-row">
          <div>
            <p class="eyebrow">PIYAK'S BIRTHDAY QUEST</p>
            <h1>삐약이의 생일 대모험 <span class="brand-heart">♥</span></h1>
          </div>
          <button class="icon-button" id="menu-button" aria-label="게임 메뉴 열기">⋯</button>
        </div>

        <div class="status-panel">
          <div class="player-chip">
            <span class="mini-avatar chick" aria-hidden="true">●</span>
            <span><small>PLAYER</small> 삐약</span>
          </div>
          <div class="date-chip"><small>DATE</small> 09.14</div>
          <div class="meter-wrap">
            <div class="meter-label">
              <span>행복 게이지</span>
              <strong id="progress-label">0%</strong>
            </div>
            <div class="meter" aria-hidden="true"><span id="progress-bar"></span></div>
          </div>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>
    </div>

    <dialog id="menu-dialog" class="pixel-dialog">
      <div class="dialog-inner">
        <p class="eyebrow">GAME MENU</p>
        <h2>잠깐 쉬어갈까요?</h2>
        <p>진행 상황은 이 기기에 자동으로 저장돼요.</p>
        <p class="install-hint"><strong>홈 화면에 앱으로 설치</strong><br />아이폰: Safari 공유 → 홈 화면에 추가<br />안드로이드: 브라우저 메뉴 → 앱 설치</p>
        <button class="button secondary" id="close-menu">계속하기</button>
        <button class="text-button danger" id="reset-game">처음부터 다시 시작</button>
      </div>
    </dialog>

    <dialog id="unlock-dialog" class="pixel-dialog unlock-dialog" aria-labelledby="unlock-title">
      <form id="unlock-form" class="dialog-inner">
        <p class="eyebrow">A LITTLE SECRET</p>
        <div class="unlock-heart" aria-hidden="true">♥</div>
        <h2 id="unlock-title">삐약이만 들어올 수 있어요</h2>
        <p>우리만 아는 네 자리 숫자를 입력해주세요.</p>
        <label class="pin-label" for="unlock-pin">비밀번호</label>
        <input id="unlock-pin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="6" autocomplete="current-password" required />
        <label class="remember-unlock"><input id="remember-unlock" type="checkbox" checked /> 이 휴대폰에서 기억하기</label>
        <p id="unlock-error" class="unlock-error" role="alert" aria-live="polite"></p>
        <button class="button" type="submit">생일 대모험 시작하기 →</button>
      </form>
    </dialog>

    <dialog id="reaction-dialog" class="pixel-dialog" aria-label="뇽뇽의 답장"><div class="dialog-inner"><p class="eyebrow">A MESSAGE FROM NYONG</p><div class="reply-heart" aria-hidden="true">♡</div><h2>뇽뇽의 답장</h2><p id="reaction-text"></p><button class="button" id="reaction-continue">좋아, 다음 이야기로 →</button></div></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="confetti" aria-hidden="true"></div>

    <script src="app.js?v=8"></script>
  </body>
</html>
